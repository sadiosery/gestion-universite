{% extends 'universite/base.html' %}
{% block titre %}Confirmation{% endblock %}
{% block entete %}Confirmation de suppression{% endblock %}
{% block contenu %}
<div class="card carte col-lg-6">
    <div class="card-body text-center py-5">
        <i class="bi bi-exclamation-triangle text-warning" style="font-size:3rem"></i>
        <h5 class="mt-3">Supprimer « {{ objet }} » ?</h5>
        <p class="text-muted">Cette action est irréversible.</p>
        <form method="post" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">
                <i class="bi bi-trash me-1"></i>Confirmer la suppression
            </button>
        </form>
        <a href="{{ retour }}" class="btn btn-outline-secondary">Annuler</a>
    </div>
</div>
{% endblock %}
